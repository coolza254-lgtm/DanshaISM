name: build

# ทุก push: ทดสอบ core + สร้าง APK
# push เข้า branch หลักของ repo (หรือกด Run workflow): สร้าง Release ที่เซ็นแล้ว ให้แอพอัปเดตตัวเองได้
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: ทดสอบตัวคำนวณ (core)
        run: ./gradlew --no-daemon :core:test

      - name: เตรียมกุญแจเซ็นแอพ
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DANSHA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "DANSHA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ยังไม่มี secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD จะสร้างเฉพาะ APK ทดสอบ (debug) และไม่สร้าง Release"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: สร้าง APK
        id: apk
        run: |
          VERSION="1.0.${{ github.run_number }}"
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon :app:assembleRelease -Pdansha.versionCode=${{ github.run_number }}
            SRC=app/build/outputs/apk/release/app-release.apk
            OUT="DanshaISM-$VERSION.apk"
          else
            ./gradlew --no-daemon :app:assembleDebug -Pdansha.versionCode=${{ github.run_number }}
            SRC=app/build/outputs/apk/debug/app-debug.apk
            OUT="DanshaISM-$VERSION-debug.apk"
          fi
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: สร้าง Release
        if: steps.keystore.outputs.signed == 'true' && (github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: 断捨ISM ${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ${{ steps.apk.outputs.file }}
          body: |
            ${{ github.event.head_commit.message || 'build จากปุ่ม Run workflow' }}

            ติดตั้ง: ดาวน์โหลด ${{ steps.apk.outputs.file }} ด้านล่างแล้วเปิดในมือถือ (ครั้งต่อไปอัปเดตจากในแอพได้เลย)
